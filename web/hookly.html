<title>Hookly</title>

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=DM+Sans:opsz,wght@9..40,400..700&family=Noto+Emoji:wght@500&display=swap">
<style>
/* Layout: one mobile column (max 32rem) over a near-black ground; translucent bottom tab bar. Dark-only by design. */
:root {
  color-scheme: dark;
  --bg: #0e0e10;
  --card: #1a1a1f;
  --card-2: #222228;
  --line: #2a2a31;
  --ink: #f4f4f5;
  --muted: #a1a1aa;
  --faint: #74747d;
  --accent: #c6f432;
  --accent-ink: #0e0e10;
  --danger: #ff6b6b;
  --f-display: "Bricolage Grotesque", ui-sans-serif, system-ui, sans-serif;
  --f-body: "DM Sans", ui-sans-serif, system-ui, sans-serif;
  --f-anton: "Anton", Impact, "Arial Narrow", sans-serif;
  --f-emoji: "Noto Emoji", "Apple Color Emoji", "Segoe UI Emoji", sans-serif;
  --radius: 1.25rem;
  --bar-h: 4.25rem;
  /* Critically damped spring, approximated (no overshoot). */
  --spring: cubic-bezier(.22, .9, .24, 1);
  --spring-pop: cubic-bezier(.34, 1.45, .5, 1);
}
* { box-sizing: border-box; }
html, body { background: var(--bg); color: var(--ink); }
body {
  font-family: var(--f-body);
  font-size: 1rem;
  line-height: 1.5;
  -webkit-tap-highlight-color: transparent;
  -webkit-text-size-adjust: 100%;
}
button, input, textarea, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.wrap { max-width: 32rem; margin: 0 auto; padding-inline: 16px; padding-block: 0 calc(var(--bar-h) + env(safe-area-inset-bottom, 0px) + 2rem); }

/* Type */
.t-display { font-family: var(--f-display); font-size: clamp(2rem, 8vw, 2.5rem); line-height: 1.05; letter-spacing: -.03em; font-weight: 700; margin: 0; text-wrap: balance; }
.t-title { font-family: var(--f-display); font-size: 1.25rem; line-height: 1.2; letter-spacing: -.015em; font-weight: 650; margin: 0; text-wrap: balance; }
.t-label { font-size: .8125rem; line-height: 1.3; letter-spacing: .01em; font-weight: 600; color: var(--muted); margin: 0; }
.t-cap { font-size: .75rem; line-height: 1.4; letter-spacing: .02em; color: var(--faint); margin: 0; }
.muted { color: var(--muted); }
.num { font-variant-numeric: tabular-nums; }

/* Header */
.top { display: flex; align-items: center; justify-content: space-between; padding-top: 1.25rem; margin-bottom: 1.25rem; gap: .5rem; }
.brand { font-family: var(--f-display); font-weight: 700; font-size: 1.125rem; letter-spacing: -.02em; }
.brand i { color: var(--accent); font-style: normal; }
.top-r { display: flex; align-items: center; gap: .5rem; }
.head { margin-bottom: 1.25rem; }
.head p { margin: .5rem 0 0; color: var(--muted); font-size: .9375rem; max-width: 34ch; }

.pill { display: inline-flex; align-items: center; gap: .25rem; min-height: 2rem; padding: 0 .75rem; border-radius: 999px; border: 1px solid var(--line); font-size: .75rem; font-weight: 600; color: var(--muted); white-space: nowrap; }
.pill b { color: var(--ink); font-weight: 700; display: inline-block; }
.pill.warn { color: var(--danger); border-color: color-mix(in srgb, var(--danger) 40%, transparent); }
.pill.pro { color: var(--accent); border-color: color-mix(in srgb, var(--accent) 45%, transparent); }
.linkbtn { min-height: 44px; padding: 0 .75rem; border: 0; background: none; color: var(--muted); font-weight: 600; font-size: .875rem; border-radius: 999px; }
.linkbtn:hover { color: var(--ink); }

/* Surfaces */
.card { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: 1rem; }
.stack { display: flex; flex-direction: column; gap: 1rem; }
.stack-s { display: flex; flex-direction: column; gap: .5rem; }
.row { display: flex; gap: .5rem; align-items: center; }
.between { display: flex; justify-content: space-between; align-items: baseline; gap: .75rem; }
.sep { height: 1px; background: var(--line); border: 0; margin: 0; }

/* Buttons: feedback on press (pointer-down), never on release */
.btn { position: relative; display: inline-flex; align-items: center; justify-content: center; gap: .5rem; min-height: 44px; padding: 0 1rem; border-radius: 1rem; border: 1px solid transparent; font-weight: 650; font-size: .9375rem; touch-action: manipulation; user-select: none; transition: transform 110ms var(--spring), opacity 110ms ease-out, background-color 160ms ease-out, border-color 160ms ease-out; }
.btn:active:not(:disabled) { transform: scale(.97); opacity: .88; transition-duration: 70ms; }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.btn-primary { background: var(--accent); color: var(--accent-ink); }
.btn-secondary { background: var(--card-2); border-color: var(--line); color: var(--ink); }
.btn-ghost { background: transparent; color: var(--ink); }
.btn-block { width: 100%; }
.btn-lg { min-height: 52px; font-size: 1rem; }
.btn svg { flex: none; }

/* Inputs */
.field { width: 100%; background: var(--bg); border: 1px solid var(--line); border-radius: .875rem; padding: .75rem .875rem; font-size: 1rem; line-height: 1.45; transition: border-color 120ms ease-out; resize: none; }
.field::placeholder { color: var(--faint); }
.field:focus { outline: none; border-color: var(--accent); }

.chips { display: flex; gap: .5rem; overflow-x: auto; margin-inline: -1rem; padding-inline: 1rem; padding-bottom: 2px; scrollbar-width: none; }
.chips::-webkit-scrollbar { display: none; }
.chips.wrap-chips { flex-wrap: wrap; overflow: visible; margin: 0; padding: 0; }
.chip { flex: none; min-height: 44px; padding: 0 1rem; border-radius: 999px; border: 1px solid var(--line); background: var(--card-2); font-size: .875rem; font-weight: 500; transition: transform 110ms var(--spring), background-color 150ms, border-color 150ms, color 150ms; }
.chip:active { transform: scale(.95); }
.chip[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }

/* Segmented control with sliding thumb */
.seg { position: relative; display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; padding: 4px; border-radius: 1rem; border: 1px solid var(--line); background: var(--bg); }
.seg-thumb { position: absolute; top: 4px; bottom: 4px; left: 4px; border-radius: .75rem; background: var(--accent); transition: transform 380ms var(--spring), width 380ms var(--spring); }
.seg button { position: relative; min-height: 44px; border: 0; background: none; border-radius: .75rem; font-weight: 650; font-size: .875rem; color: var(--muted); transition: color 160ms; }
.seg button[aria-checked="true"] { color: var(--accent-ink); }
.seg button[aria-disabled="true"] { color: var(--faint); }

/* Hook cards cascade in */
.hooks { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: .75rem; }
.hook { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: 1rem; animation: rise 520ms var(--spring) both; }
@keyframes rise { from { opacity: 0; transform: translateY(16px) scale(.98); } to { opacity: 1; transform: none; } }
.hook p { margin: .625rem 0 0; font-size: 1.0625rem; line-height: 1.4; font-weight: 500; letter-spacing: -.005em; }
.hook .acts { display: flex; gap: .5rem; margin-top: .875rem; }
.hook .acts .btn { border-radius: .75rem; font-size: .875rem; }
.tag { display: inline-flex; align-items: center; gap: .375rem; padding: .25rem .625rem; border-radius: 999px; font-size: .75rem; font-weight: 650; letter-spacing: .02em; }
.tag::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
.example-flag { font-size: .6875rem; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--faint); }

/* Copy button feedback */
.copy { min-width: 44px; }
.copy .ico { position: relative; width: 18px; height: 18px; display: inline-grid; place-items: center; }
.copy .ico svg { position: absolute; transition: transform 260ms var(--spring-pop), opacity 160ms; }
.copy .i-check { transform: scale(.4); opacity: 0; }
.copy.ok { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.copy.ok .i-copy { transform: scale(.4); opacity: 0; }
.copy.ok .i-check { transform: scale(1); opacity: 1; }

.skel { background: linear-gradient(90deg, #222228 0%, #2c2c34 50%, #222228 100%); background-size: 200% 100%; animation: shimmer 1.4s ease-in-out infinite; border-radius: .5rem; height: 1rem; }
@keyframes shimmer { from { background-position: 100% 0; } to { background-position: -100% 0; } }
.spinner { width: 18px; height: 18px; border-radius: 50%; border: 2px solid currentColor; border-right-color: transparent; animation: spin .7s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }

.alert { display: flex; gap: .625rem; padding: 1rem; border-radius: 1rem; border: 1px solid color-mix(in srgb, var(--danger) 30%, transparent); background: color-mix(in srgb, var(--danger) 10%, transparent); font-size: .875rem; animation: rise 360ms var(--spring) both; }
.alert svg { color: var(--danger); flex: none; margin-top: 2px; }
.alert p { margin: 0; }
.note { padding: .875rem 1rem; border-radius: 1rem; background: var(--card-2); font-size: .875rem; color: var(--muted); }

/* Recents */
.recent { width: 100%; display: flex; justify-content: space-between; align-items: center; gap: .75rem; min-height: 3.5rem; padding: .75rem 1rem; border-radius: 1rem; border: 1px solid var(--line); background: var(--card); text-align: left; }
.recent span:first-child { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }

/* Bottom bar: translucent material, content scrolls beneath */
.bar { position: fixed; inset-inline: 0; bottom: 0; z-index: 40; background: rgb(14 14 16 / .74); backdrop-filter: blur(20px) saturate(160%); -webkit-backdrop-filter: blur(20px) saturate(160%); border-top: 1px solid rgb(255 255 255 / .06); padding-bottom: env(safe-area-inset-bottom, 0px); }
.bar ul { list-style: none; margin: 0 auto; padding: 0 .5rem; max-width: 32rem; height: var(--bar-h); display: grid; grid-template-columns: repeat(3, 1fr); }
.bar a { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: .25rem; height: 100%; text-decoration: none; color: var(--faint); font-size: .75rem; font-weight: 650; letter-spacing: .01em; transition: color 150ms; }
.bar a .pillbg { position: relative; display: grid; place-items: center; width: 3.5rem; height: 2rem; border-radius: 999px; transition: background-color 260ms var(--spring); }
.bar a[aria-current="page"] { color: var(--ink); }
.bar a[aria-current="page"] .pillbg { background: color-mix(in srgb, var(--accent) 15%, transparent); color: var(--accent); }
@media (prefers-reduced-transparency: reduce) { .bar { background: var(--card); backdrop-filter: none; -webkit-backdrop-filter: none; } }

/* Sheet */
.scrim { position: fixed; inset: 0; z-index: 50; background: rgb(0 0 0 / .6); opacity: 0; transition: opacity 200ms ease-out; }
.scrim.open { opacity: 1; }
.sheet { position: fixed; inset-inline: 0; bottom: 0; z-index: 51; margin: 0 auto; max-width: 34rem; max-height: 90dvh; display: flex; flex-direction: column; background: var(--card); border: 1px solid var(--line); border-bottom: 0; border-radius: 1.75rem 1.75rem 0 0; box-shadow: inset 0 1px 0 rgb(255 255 255 / .06), 0 -24px 60px rgb(0 0 0 / .45); transform: translateY(100%); transition: transform 380ms var(--spring); outline: none; }
.sheet.open { transform: translateY(0); }
.sheet.dragging { transition: none; }
.sheet-head { display: flex; align-items: flex-start; gap: .75rem; padding: .75rem 1.25rem .5rem; touch-action: none; cursor: grab; }
.grab { width: 2.5rem; height: 6px; border-radius: 999px; background: var(--line); margin: 0 auto .75rem; }
.sheet-body { overflow-y: auto; overscroll-behavior: contain; padding: .5rem 1.25rem calc(1.5rem + env(safe-area-inset-bottom, 0px)); }
.iconbtn { display: grid; place-items: center; width: 44px; height: 44px; flex: none; border-radius: 50%; border: 0; background: var(--card-2); color: var(--muted); }
.sec { border-left: 2px solid var(--line); padding-left: .875rem; }
.sec h4 { margin: 0 0 .25rem; font-size: .875rem; font-weight: 700; letter-spacing: .01em; display: flex; gap: .5rem; align-items: baseline; }
.sec p { margin: 0; white-space: pre-line; font-size: .9375rem; line-height: 1.55; }
.cap-card { border: 1px solid var(--line); border-radius: 1rem; padding: .875rem; background: color-mix(in srgb, var(--bg) 60%, transparent); animation: rise 480ms var(--spring) both; }
.cap-card p { margin: 0; font-size: .9375rem; }
.cap-card .hs { margin-top: .5rem; color: color-mix(in srgb, var(--accent) 90%, white); font-size: .875rem; font-weight: 500; }

/* Progress */
.prog-track { height: 8px; border-radius: 999px; background: var(--card-2); overflow: hidden; }
.prog-fill { height: 100%; width: 100%; background: var(--accent); border-radius: 999px; transform-origin: left; transform: scaleX(0); }

/* Subtitles */
.drop { display: flex; flex-direction: column; align-items: center; text-align: center; padding: 2.5rem 1.5rem; border: 1px dashed var(--line); border-radius: var(--radius); background: var(--card); transition: border-color 150ms, background-color 150ms; }
.drop.over { border-color: var(--accent); background: color-mix(in srgb, var(--accent) 5%, var(--card)); }
.drop .badge { display: grid; place-items: center; width: 3.5rem; height: 3.5rem; border-radius: 1rem; background: var(--card-2); color: var(--accent); margin-bottom: 1rem; }
.drop p { margin: .375rem 0 0; max-width: 32ch; }
.frame { position: relative; margin: 0 auto; width: 100%; max-width: min(100%, calc(60dvh * 9 / 16)); aspect-ratio: 9 / 16; border-radius: 1.25rem; overflow: hidden; border: 1px solid var(--line); background: #000; }
.frame video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.capline { position: absolute; left: 8%; right: 8%; text-align: center; pointer-events: none; }
.capline .w { display: inline-block; transition: transform 160ms var(--spring-pop), color 80ms, opacity 80ms; }
.thumbvid { width: 6rem; aspect-ratio: 9/16; object-fit: cover; border-radius: .75rem; background: #000; flex: none; }
.player { display: flex; align-items: center; gap: .75rem; }
.player input[type=range] { flex: 1; min-width: 0; height: 44px; accent-color: var(--accent); }
.play { display: grid; place-items: center; width: 44px; height: 44px; flex: none; border-radius: 50%; border: 0; background: var(--ink); color: var(--bg); }
.styles { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: .5rem; }
.stylebtn { display: flex; flex-direction: column; align-items: center; gap: .5rem; padding: .5rem .5rem .625rem; border-radius: 1rem; border: 1px solid var(--line); background: var(--card-2); transition: transform 110ms var(--spring), border-color 150ms, background-color 150ms; min-width: 0; }
.stylebtn:active { transform: scale(.96); }
.stylebtn[aria-checked="true"] { border-color: var(--accent); background: color-mix(in srgb, var(--accent) 10%, var(--card-2)); box-shadow: 0 0 0 1px var(--accent); }
.stylebtn .sw { display: grid; place-items: center; width: 100%; height: 3.5rem; border-radius: .75rem; background: #3a3a44; overflow: hidden; font-size: 1.5rem; line-height: 1; }
.stylebtn span:last-child { font-size: .75rem; font-weight: 650; color: var(--muted); }
.stylebtn[aria-checked="true"] span:last-child { color: var(--ink); }
.switch { display: flex; align-items: center; justify-content: space-between; gap: 1rem; width: 100%; min-height: 44px; border: 0; background: none; text-align: left; padding: 0; }
.switch .tr { position: relative; flex: none; width: 3rem; height: 1.75rem; border-radius: 999px; background: var(--line); transition: background-color 200ms; }
.switch .tr::after { content: ""; position: absolute; top: 2px; left: 2px; width: 1.5rem; height: 1.5rem; border-radius: 50%; background: var(--ink); transition: transform 380ms var(--spring); }
.switch[aria-checked="true"] .tr { background: var(--accent); }
.switch[aria-checked="true"] .tr::after { transform: translateX(1.25rem); }
.lines { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: .375rem; }
.lines li { display: flex; align-items: center; gap: .5rem; padding-inline: .375rem; border-radius: .75rem; border: 1px solid transparent; transition: background-color 150ms, border-color 150ms; }
.lines li.on { border-color: color-mix(in srgb, var(--accent) 50%, transparent); background: color-mix(in srgb, var(--accent) 5%, transparent); }
.lines .tm { width: 3rem; min-height: 44px; flex: none; border: 0; background: none; text-align: left; font-size: .75rem; font-weight: 650; color: var(--faint); font-variant-numeric: tabular-nums; }
.lines input { flex: 1; min-width: 0; min-height: 44px; border: 0; border-radius: .5rem; background: transparent; padding: 0 .5rem; font-size: .9375rem; }
.lines input:focus { outline: none; background: var(--bg); }
.lines .em { flex: none; padding-right: .5rem; color: var(--muted); font-family: var(--f-emoji); }
.result video { width: 100%; max-width: min(100%, calc(55dvh * 9 / 16)); margin: 0 auto; display: block; aspect-ratio: 9/16; border-radius: 1rem; background: #000; }


/* Editor */
.steps { list-style: none; margin: -.25rem 0 1.25rem; padding: 0; display: flex; gap: .375rem; flex-wrap: wrap; }
.steps li { display: inline-flex; align-items: center; gap: .375rem; min-height: 2rem; padding: 0 .75rem 0 .375rem; border-radius: 999px; border: 1px solid var(--line); font-size: .75rem; font-weight: 650; color: var(--faint); }
.steps .n { display: grid; place-items: center; width: 1.375rem; height: 1.375rem; border-radius: 50%; background: var(--card-2); font-size: .6875rem; }
.steps li.now { color: var(--ink); border-color: color-mix(in srgb, var(--accent) 50%, transparent); }
.steps li.now .n { background: var(--accent); color: var(--accent-ink); }
.steps li.done { color: var(--muted); }
.steps li.done .n { background: color-mix(in srgb, var(--accent) 18%, transparent); color: var(--accent); }
.how { display: grid; gap: .5rem; margin-top: 1rem; }
.how div { display: flex; gap: .75rem; align-items: flex-start; padding: .75rem 1rem; border-radius: 1rem; background: var(--card); border: 1px solid var(--line); font-size: .875rem; color: var(--muted); }
.how b { display: grid; place-items: center; flex: none; width: 1.5rem; height: 1.5rem; border-radius: 50%; background: var(--card-2); color: var(--accent); font-size: .75rem; }
.ai-card { border-color: color-mix(in srgb, var(--accent) 35%, var(--line)); background: linear-gradient(180deg, color-mix(in srgb, var(--accent) 6%, var(--card)) 0%, var(--card) 55%); }
.ai-card .t-title { display: flex; align-items: center; gap: .5rem; }
.ai-card .t-title svg { color: var(--accent); }
.clips { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: .375rem; }
.clip { display: flex; align-items: center; gap: .5rem; padding: .25rem .25rem .25rem .5rem; border-radius: .875rem; background: var(--bg); border: 1px solid var(--line); animation: rise 420ms var(--spring) both; transition: opacity 160ms; }
.clip.off { opacity: .45; }
.clip-tm { flex: none; min-height: 44px; padding: 0 .5rem; border: 0; border-radius: .625rem; background: var(--card-2); font-size: .75rem; font-weight: 700; font-variant-numeric: tabular-nums; }
.clip-m { flex: 1; min-width: 0; font-size: .875rem; color: var(--muted); overflow: hidden; text-overflow: ellipsis; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
.clip-t { flex: none; display: grid; place-items: center; width: 3.5rem; height: 44px; border: 0; background: none; padding: 0; }
.clip-t .tr { position: relative; width: 2.75rem; height: 1.625rem; border-radius: 999px; background: var(--line); transition: background-color 200ms; }
.clip-t .tr::after { content: ""; position: absolute; top: 2px; left: 2px; width: 1.375rem; height: 1.375rem; border-radius: 50%; background: var(--ink); transition: transform 380ms var(--spring); }
.clip-t[aria-checked="true"] .tr { background: var(--accent); }
.clip-t[aria-checked="true"] .tr::after { transform: translateX(1.125rem); }
.lines li.out { opacity: .4; }
.ovl-title { position: absolute; left: 8%; right: 8%; top: 13%; text-align: center; pointer-events: none; }
.frame-badge { position: absolute; top: .75rem; left: .75rem; padding: .25rem .625rem; border-radius: 999px; background: rgb(14 14 16 / .7); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); font-size: .6875rem; font-weight: 700; letter-spacing: .04em; color: var(--ink); }
.voice-row { display: flex; align-items: center; gap: .75rem; padding: .5rem .5rem .5rem .5rem; border-radius: 1rem; background: var(--bg); border: 1px solid var(--line); }
details > summary::-webkit-details-marker { display: none; }

/* Mi estilo */
.preview-box { position: relative; margin: 0 auto; width: 100%; max-width: 15rem; aspect-ratio: 4 / 5; border-radius: 1.25rem; border: 1px solid var(--line); overflow: hidden; background: radial-gradient(120% 80% at 20% 10%, #3b3b46 0%, #23232a 45%, #141418 100%); }
.swatches { display: flex; flex-wrap: wrap; gap: .5rem; align-items: center; }
.swatch { display: grid; place-items: center; width: 44px; height: 44px; border-radius: 50%; border: 2px solid var(--line); transition: transform 110ms var(--spring), border-color 150ms; }
.swatch:active { transform: scale(.9); }
.swatch[aria-pressed="true"] { border-color: var(--ink); }
.swatch-other { position: relative; display: grid; place-items: center; min-width: 44px; height: 44px; padding: 0 .75rem; border-radius: 999px; border: 2px dashed var(--line); font-size: .75rem; font-weight: 650; color: var(--muted); cursor: pointer; }
.swatch-other input { position: absolute; inset: 0; opacity: 0; width: 100%; height: 100%; cursor: pointer; }
.fonts { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: .5rem; }
.fontbtn { min-height: 5rem; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: .25rem; border-radius: 1rem; border: 1px solid var(--line); background: var(--card-2); transition: transform 110ms var(--spring), border-color 150ms; }
.fontbtn:active { transform: scale(.96); }
.fontbtn[aria-checked="true"] { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); background: color-mix(in srgb, var(--accent) 10%, var(--card-2)); }
.fontbtn b { font-size: 1.5rem; line-height: 1; font-weight: inherit; }
.fontbtn span { font-size: .75rem; font-weight: 650; color: var(--muted); }

<script>
(() => {
"use strict";

/* ---------------- Icons ---------------- */
const I = {

};

/* ---------------- Utils ---------------- */
const $ = (s, r = document) => r.querySelector(s);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const reduceMotion = () => matchMedia("(prefers-reduced-motion: reduce)").matches;
const store = {
  get(k, fb) { try { const v = localStorage.getItem("hookly:" + k); return v == null ? fb : JSON.parse(v); } catch { return fb; } },
  set(k, v) { try { localStorage.setItem("hookly:" + k, JSON.stringify(v)); return true; } catch { return false; } },
};
const hoyMX = () => { try { return new Intl.DateTimeFormat("en-CA", { timeZone: "America/Mexico_City" }).format(new Date()); } catch { return new Date().toISOString().slice(0, 10); } };
const fmtT = (s) => `${Math.floor(s / 60)}:${String(Math.floor(s % 60)).padStart(2, "0")}`;
const mb = (b) => Math.round(b / 1048576);

async function copiar(texto) {
  try { await navigator.clipboard.writeText(texto); return true; } catch {
    try {
      const ta = document.createElement("textarea"); ta.value = texto; ta.setAttribute("readonly", ""); ta.style.cssText = "position:fixed;opacity:0";
      document.body.appendChild(ta); ta.select(); const ok = document.execCommand("copy"); ta.remove(); return ok;
    } catch { return false; }
  }
}
function copyBtn(text, label = "Copiar") {
  return `<button class="btn btn-secondary copy" data-copy="${esc(text)}" data-label="${esc(label)}"><span class="ico">${I.copy}${I.check}</span><span class="lbl">${esc(label)}</span></button>`;
}
document.addEventListener("click", async (e) => {
  const b = e.target.closest("[data-copy]");
  if (!b) return;
  const ok = await copiar(b.dataset.copy);
  const lbl = b.querySelector(".lbl");
  b.classList.toggle("ok", ok);
  if (lbl) lbl.textContent = ok ? "Copiado" : "Selecciona y copia";
  if (ok) navigator.vibrate?.(8);
  clearTimeout(b._t);
  b._t = setTimeout(() => { b.classList.remove("ok"); if (lbl) lbl.textContent = b.dataset.label; }, 1600);
});

/* Smooth progress: a critically damped spring chases the real value. */
function makeProgress(el, pctEl) {
  let x = 0, v = 0, target = 0, raf = 0, last = 0;
  const w = 2 * Math.PI / 0.6; // response ~0.6 s
  const step = (t) => {
    const dt = Math.min(0.05, (t - (last || t)) / 1000); last = t;
    if (reduceMotion()) { x = target; v = 0; } else {
      const a = w * w * (target - x) - 2 * w * v; v += a * dt; x += v * dt;
    }
    el.style.transform = `scaleX(${Math.max(0, Math.min(1, x))})`;
    if (pctEl) pctEl.textContent = Math.round(Math.max(0, Math.min(1, x)) * 100) + "%";
    if (Math.abs(target - x) > 0.001 || Math.abs(v) > 0.001) raf = requestAnimationFrame(step); else { raf = 0; last = 0; }
  };
  return { set(val) { target = Math.max(0, Math.min(1, val)); if (!raf) raf = requestAnimationFrame(step); } };
}

/* ---------------- Capabilities ---------------- */
let samplePromise = window.claude?.use ? window.claude.use("sample").catch(() => null) : Promise.resolve(null);
let downloadsPromise = window.claude?.use ? window.claude.use("downloads").catch(() => null) : Promise.resolve(null);
let sampleFn = null; samplePromise.then((s) => { sampleFn = s; if (state.tab === "hooks") render(); });

/* ---------------- State ---------------- */
const TONOS = [
  { id: "cercano", label: "Cercano", desc: "Como platicando con un amigo", prompt: "cercano, como platicando con un amigo" },
  { id: "divertido", label: "Divertido", desc: "Ligero, con humor", prompt: "divertido y ligero, con humor sin burlarse de nadie" },
  { id: "directo", label: "Directo", desc: "Al grano, sin rodeos", prompt: "directo y al grano, sin rodeos" },
  { id: "experto", label: "Experto", desc: "Con autoridad y claridad", prompt: "experto, con autoridad y claridad, sin tecnicismos innecesarios" },
  { id: "inspirador", label: "Inspirador", desc: "Motivador, sin exagerar", prompt: "inspirador y motivador, sin exagerar ni sonar a frase de póster" },
];
const FUENTES = [
  { id: "bricolage", label: "Bricolage", css: 'var(--f-display)', canvas: '"Bricolage Grotesque"', weight: 800 },
  { id: "dmsans", label: "DM Sans", css: 'var(--f-body)', canvas: '"DM Sans"', weight: 700 },
  { id: "anton", label: "Anton", css: 'var(--f-anton)', canvas: '"Anton"', weight: 400 },
];
const ESTILO_DEF = { colorTexto: "#FFFFFF", colorResaltado: "#C6F432", colorContorno: "#0E0E10", fuente: "bricolage", mayusculas: true, tono: "cercano", ejemplos: [] };
const NICHOS = ["Finanzas", "Fitness", "Comida", "Belleza", "Tecnología", "Educación", "Humor", "Viajes", "Negocios", "Gaming", "Moda", "Crianza"];
const PLATS = [{ id: "tiktok", label: "TikTok" }, { id: "reels", label: "Reels" }, { id: "shorts", label: "Shorts" }];
const TIPOS = { "polémica": { label: "Polémica", color: "#FF8A66" }, pregunta: { label: "Pregunta", color: "#7CC6FE" }, historia: { label: "Historia", color: "#F5C26B" }, dato: { label: "Dato", color: "#C6F432" }, curiosidad: { label: "Curiosidad", color: "#C9A2FF" } };
const LIMITE = 3;

const EJEMPLO = {
  id: "ejemplo", ejemplo: true,
  ctx: { idea: "3 errores que cometí al ahorrar mi primer sueldo", nicho: "Finanzas", plataforma: "tiktok" },
  hooks: [
    { tipo: "polémica", texto: "Ahorrar lo que te sobra es la peor forma de ahorrar" },
    { tipo: "pregunta", texto: "¿Por qué tu sueldo se acaba antes de la quincena?" },
    { tipo: "historia", texto: "Con mi primer sueldo cometí tres errores que todavía pago" },
    { tipo: "dato", texto: "Separar tu ahorro el mismo día de pago cambia todo" },
    { tipo: "curiosidad", texto: "El error número dos lo comete casi todo mundo sin saberlo" },

};

const state = {
  tab: "hooks",
  estilo: { ...ESTILO_DEF, ...store.get("estilo", {}) },
  prefs: { plataforma: "tiktok", nicho: undefined, ...store.get("prefs", {}) },
  pro: store.get("pro", false) === true,
  idea: "",
  cargando: false,
  error: null,
  tanda: null,
  guiones: {},
  hookAbierto: null,
  historial: (() => { const h = store.get("historial", []); return Array.isArray(h) ? h : []; })(),
  ultimoGuion: store.get("ultimoGuion", null),
  subs: { fase: "vacio", estiloId: store.get("subsEstilo", "bold"), emojis: store.get("subsEmojis", true), calidad: 720, palabras: [], texto: "" },
};
function uso() {
  const u = store.get("uso", null);
  return u && u.fecha === hoyMX() ? u.usados : 0;
}
function sumarUso() { store.set("uso", { fecha: hoyMX(), usados: uso() + 1 }); }
function saveEstilo() { store.set("estilo", state.estilo); }

/* ---------------- Router ---------------- */
function tabFromHash() {
  const h = (location.hash || "").replace("#", "");
  return ["hooks", "subtitulos", "estilo", "planes"].includes(h) ? h : "hooks";
}
window.addEventListener("hashchange", () => { state.tab = tabFromHash(); render(true); });
function go(tab) { if (location.hash !== "#" + tab) location.hash = tab; else { state.tab = tab; render(true); } }

/* ---------------- Header ---------------- */
function header(title, sub, aside = "") {
  return `<div class="top"><span class="brand">hookly<i>.</i></span><div class="top-r">${aside}<button class="linkbtn" data-go="planes">Planes</button></div></div>

/* ---------------- Render root ---------------- */
const app = $("#app");
function render(scrollTop) {
  document.querySelectorAll(".bar a").forEach((a) => { if (a.dataset.tab === state.tab) a.setAttribute("aria-current", "page"); else a.removeAttribute("aria-current"); });
  if (state.tab !== "subtitulos") stopPreviewLoop();
  if (state.tab === "hooks") renderHooks();

}

/* =========================================================
   HOOKS
   ========================================================= */
function usagePill() {
  if (state.pro) return `<span class="pill pro">Pro</span>`;
  const r = Math.max(0, LIMITE - uso());

    </div>
    <div>
      <span class="t-label" id="nicho-l" style="display:block;margin-bottom:.5rem">Nicho</span>
      <div class="chips" role="group" aria-labelledby="nicho-l">${NICHOS.map((n) => `<button class="chip" data-nicho="${n}" aria-pressed="${s.prefs.nicho === n}">${n}</button>`).join("")}</div>
    </div>
    <div>
      <span class="t-label" style="display:block;margin-bottom:.5rem">Plataforma</span>
      ${segHTML("plat", PLATS, s.prefs.plataforma, "Plataforma")}
    </div>
    <button class="btn btn-primary btn-block btn-lg" id="gen" ${s.cargando || s.idea.trim().length < 3 || sinGen || sampleFn === null && samplePromiseDone ? "disabled" : ""} aria-busy="${s.cargando}">
      ${s.cargando ? `<span class="spinner" aria-hidden="true"></span>Generando hooks…` : `${I.sparkle}Generar hooks`}
    </button>
    ${sinGen ? `<p class="t-cap" style="text-align:center;margin-top:-.5rem">Usaste tus generaciones de hoy. <button class="linkbtn" data-go="planes" style="color:var(--accent);min-height:auto;padding:0">Ver plan Pro</button></p>` : ""}
    ${samplePromiseDone && sampleFn === null ? `<p class="t-cap" style="text-align:center;margin-top:-.5rem">La generación con IA funciona al abrir esta página en Claude.</p>` : ""}
  </div>
  <div id="hk-err">${s.error ? errHTML(s.error) : ""}</div>
  <section style="margin-top:2rem;${s.cargando ? "opacity:.45;transition:opacity 200ms" : ""}" id="res">
    <div class="between" style="margin-bottom:.75rem">
      <h2 class="t-title">${tanda.ejemplo ? "Así se ven tus hooks" : "Tus hooks"}</h2>
      <span class="t-cap">${tanda.ejemplo ? `<span class="example-flag">Ejemplo</span>` : esc(plat + (tanda.ctx.nicho ? " · " + tanda.ctx.nicho : ""))}</span>
    </div>
    ${hookListHTML(tanda)}
  </section>
  ${s.historial.length ? `<section style="margin-top:2.5rem">
    <div class="between" style="margin-bottom:.75rem"><h2 class="t-title">Recientes</h2><button class="linkbtn" id="hist-clear">Borrar</button></div>
    <ul class="stack-s" style="list-style:none;margin:0;padding:0">${s.historial.slice(0, 5).map((h, i) => `<li><button class="recent" data-hist="${i}" style="${s.tanda?.id === h.id ? "border-color:color-mix(in srgb,var(--accent) 50%,transparent)" : ""}"><span>${esc(h.ctx.idea)}</span><span class="t-cap">${new Date(h.fecha).toLocaleDateString("es-MX", { day: "numeric", month: "short" })}</span></button></li>`).join("")}</ul>
  </section>` : ""}
  <p class="t-cap" style="text-align:center;margin-top:2.5rem">Los hooks son sugerencias creativas. Ningún texto garantiza vistas ni resultados.</p>
  </div>`;
  bindSeg("plat", (v) => { s.prefs.plataforma = v; store.set("prefs", s.prefs); });
  const idea = $("#idea");
  idea.addEventListener("input", () => { s.idea = idea.value; $("#idea-n").textContent = `${s.idea.length}/500`; $("#gen").disabled = s.cargando || s.idea.trim().length < 3 || sinGen || (samplePromiseDone && sampleFn === null); });
  idea.addEventListener("keydown", (e) => { if (e.key === "Enter" && (e.metaKey || e.ctrlKey)) generar(); });
  app.querySelectorAll("[data-nicho]").forEach((b) => b.addEventListener("click", () => {
    s.prefs.nicho = s.prefs.nicho === b.dataset.nicho ? undefined : b.dataset.nicho; store.set("prefs", s.prefs);

const sheet = $("#sheet"), scrim = $("#scrim"), sheetBody = $("#sheet-body");

function closeSheet() {
  if (!sheetOpen) return; sheetOpen = false;
  scrim.classList.remove("open"); sheet.classList.remove("open"); sheet.style.transform = "";

document.addEventListener("keydown", (e) => { if (e.key === "Escape" && sheetOpen) closeSheet(); });
(() => {
  const head = $("#sheet-head"); let y0 = 0, dy = 0, hist = [], dragging = false;
  head.addEventListener("pointerdown", (e) => { dragging = true; y0 = e.clientY; dy = 0; hist = [{ y: e.clientY, t: e.timeStamp }]; head.setPointerCapture(e.pointerId); sheet.classList.add("dragging"); });
  head.addEventListener("pointermove", (e) => {
    if (!dragging) return; dy = e.clientY - y0;
    const off = dy < 0 ? dy * 0.12 : dy; // rubber-band upward
    sheet.style.transform = `translateY(${off}px)`;
    hist.push({ y: e.clientY, t: e.timeStamp }); if (hist.length > 6) hist.shift();
  });
  const end = () => {
    if (!dragging) return; dragging = false; sheet.classList.remove("dragging");
    const a = hist[0], b = hist[hist.length - 1]; const vel = b && a && b.t > a.t ? ((b.y - a.y) / (b.t - a.t)) * 1000 : 0;
    const rest = dy + ((vel / 1000) * 0.998) / (1 - 0.998); // Apple's projection

function agrupar(palabras) {
  const grupos = []; let act = [], desde = 0;
  const cerrar = () => { if (act.length) { grupos.push({ desde, palabras: act, start: act[0].start, end: act[act.length - 1].end }); act = []; } };
  palabras.forEach((p, i) => {
    if (act.length) {
      const prev = act[act.length - 1]; const chars = act.reduce((n, w) => n + w.text.length + 1, 0) + p.text.length;
      if (act.length >= 3 || chars > 16 || p.start - prev.end > 0.6 || /[.!?…,;:]$/.test(prev.text)) cerrar();
    }
    if (!act.length) desde = i; act.push(p);
  });
  cerrar();
  for (let i = 0; i < grupos.length; i++) { const n = grupos[i + 1]; grupos[i].end = Math.min(grupos[i].end + 0.35, n ? n.start : Infinity); }
  return grupos;
}

/* Spread pasted (or voice-over) words over the voiced regions found by vad(). */
function sincronizar(texto, voz) {
  const words = texto.replace(/\s+/g, " ").trim().split(" ").filter(Boolean);
  if (!words.length) return [];
  let segs = voz.segs.length ? voz.segs : [[0, voz.dur]];
  const total = segs.reduce((n, [a, b]) => n + (b - a), 0) || voz.dur;
  const pesos = words.map((w) => w.length + 1 + (/[.!?…]$/.test(w) ? 3 : /[,;:]$/.test(w) ? 1.5 : 0));
  const P = pesos.reduce((x, y) => x + y, 0);
  const at = (x) => { // map 0..total voiced seconds to timeline
    let acc = 0; for (const [a, b] of segs) { const d = b - a; if (x <= acc + d) return a + (x - acc); acc += d; } return segs[segs.length - 1][1];
  };
  let c = 0;
  return words.map((w, i) => { const s = at((c / P) * total); c += pesos[i]; const e = at((c / P) * total - (/[.!?…,;:]$/.test(w) ? (pesos[i] - w.length - 1) / P * total : 0)); return { text: w, start: s, end: Math.max(s + 0.08, e) }; });
}
function reemplazarGrupo(palabras, g, texto) {
  const nuevas = texto.trim().split(/\s+/).filter(Boolean); const ini = g.palabras[0].start, fin = g.palabras[g.palabras.length - 1].end;
  const tot = nuevas.reduce((n, w) => n + w.length, 0) || 1; let t = ini;
  const rep = nuevas.map((w) => { const d = (fin - ini) * w.length / tot; const p = { text: w, start: t, end: t + d }; t += d; return p; });
  return [...palabras.slice(0, g.desde), ...rep, ...palabras.slice(g.desde + g.palabras.length)];
}

  try {
    const { text } = await sample(`Escribe una sola frase de voz en off, en español de México, para abrir un video corto. Máximo 18 palabras, tono ${tono}, sin emojis, sin prometer viralidad ni inventar datos. ${S.titulo ? `Título del short: "${S.titulo}". ` : ""}Esto es lo que se dice en el video (material del creador):\n<video>${txt || "(sin voz)"}</video>\nResponde solo con la frase.`, { modelTier: "quick", cache: false });
    V.texto = text.trim().replace(/^["“]|["”]$/g, "").slice(0, 280); V.estado = V.audio ? "listo" : "idle";
  } catch (e) { V.estado = V.audio ? "listo" : "idle"; V.msg = errorIA(e) || ""; }
  renderSubs();
}
async function generarVoz() {
  const S = state.subs; const V = S.voz; const texto = V.texto.trim(); if (!texto) return;
  V.estado = "cargando"; V.progreso = 0; V.msg = ""; renderSubs();
  onAvanceAI = (d) => {
    if (d.type === "descarga" && d.grupo === "narracion") { V.progreso = d.progreso; const p = $("#v-prog"); if (p) { p._p ||= makeProgress($("#v-fill"), $("#v-pct")); p._p.set(d.progreso * 0.85); $("#v-lbl").textContent = "Preparando la voz (solo la primera vez, unos 40 MB)"; } }
    if (d.type === "sintetizando") { const p = $("#v-prog"); if (p) { p._p ||= makeProgress($("#v-fill"), $("#v-pct")); p._p.set(0.92); $("#v-lbl").textContent = "Generando la voz…"; } }
  };
  try {
    const r = await aiCall({ type: "hablar", texto });
    if (V.url) URL.revokeObjectURL(V.url);
    // Trim leading/trailing silence so the voice starts right away.
    let a = r.audio; let i0 = 0, i1 = a.length; while (i0 < i1 && Math.abs(a[i0]) < 0.01) i0++; while (i1 > i0 && Math.abs(a[i1 - 1]) < 0.01) i1--;
    a = a.slice(Math.max(0, i0 - 800), Math.min(a.length, i1 + 1600));
    Object.assign(V, { audio: a, audio16: r.sr === 16000 ? a : null, sr: r.sr, dur: a.length / r.sr, url: URL.createObjectURL(wavDe(a, r.sr)), estado: "listo", textoGenerado: texto });
  } catch (e) {
    console.error(e);
    V.estado = "error"; V.msg = "No pudimos generar la voz en este dispositivo. Intenta de nuevo o usa otra frase más corta.";
  }
  if (state.tab === "subtitulos") renderSubs();
}

function bindSubs() {

  $("#pick")?.addEventListener("click", () => file.click());
  file?.addEventListener("change", () => { const f = file.files?.[0]; if (f) elegirVideo(f); file.value = ""; });
  if (drop) {
    drop.addEventListener("dragover", (ev) => { ev.preventDefault(); drop.classList.add("over"); });
    drop.addEventListener("dragleave", () => drop.classList.remove("over"));
    drop.addEventListener("drop", (ev) => { ev.preventDefault(); drop.classList.remove("over"); const f = ev.dataTransfer.files?.[0]; if (f) elegirVideo(f); });
  }
  $("#change")?.addEventListener("click", () => { resetSubs(true); renderSubs(); });

  if ($("#t-avance")) pintarAvanceT();

  gt?.addEventListener("input", () => { S.texto = gt.value; const b = $("#sync"); if (b) b.disabled = !S.texto.trim(); });
  $("#use-guion")?.addEventListener("click", () => { const g = state.ultimoGuion; S.texto = [g.hook, g.desarrollo, g.cierre].join("\n"); renderSubs(); });
  $("#sync")?.addEventListener("click", sincronizarTexto);

  bindSeg("obj", (v) => { S.objetivo = v; });
  $("#mk")?.addEventListener("click", crearShort);

      <div class="stack-s" id="ejs">${E.ejemplos.map((x, i) => `<div class="ej"><textarea class="field" rows="2" maxlength="200" data-ej="${i}" aria-label="Ejemplo ${i + 1}" placeholder="Ej. Nadie te dice esto antes de rentar tu primer depa">${esc(x)}</textarea><button class="iconbtn" style="border-radius:.75rem;background:none" data-delej="${i}" aria-label="Quitar ejemplo ${i + 1}">${I.trash}</button></div>`).join("")}</div>
      ${E.ejemplos.length < 5 ? `<button class="btn btn-secondary" id="addej">${I.plus}Agregar ejemplo</button>` : ""}
    </section>
    <div style="display:flex;flex-direction:column;align-items:center;gap:.25rem"><button class="btn btn-ghost" id="reset">Restablecer valores</button><p class="t-cap">Se guarda solo en este navegador.</p></div>
  </div></div>`;
  bindEstilo();
}
function luminancia(hex) { const n = parseInt(hex.replace("#", "").slice(0, 6), 16); return (0.299 * ((n >> 16) & 255) + 0.587 * ((n >> 8) & 255) + 0.114 * (n & 255)) / 255; }
let estiloTimer = 0, demoTimer = 0, demoK = 0;
function guardado() { saveEstilo(); const s = $("#saved"); if (!s) return; s.classList.add("show"); clearTimeout(estiloTimer); estiloTimer = setTimeout(() => s.classList.remove("show"), 1400); }
function bindEstilo() {
  const E = state.estilo;
  const pbox = $("#pbox"), pcap = $("#pcap");
  const G = { desde: 0, start: 0, end: 5, palabras: ["Así", "se", "ve", "tu", "estilo"].map((w, i) => ({ text: w, start: i, end: i + 1 })) };
  const paint = () => { const e = estiloMio(E); e.tamano *= 1.15; pcap.innerHTML = capLineHTML(G, reduceMotion() ? 2 : demoK, e, pbox.clientWidth, null); };
  paint(); new ResizeObserver(paint).observe(pbox);
  clearInterval(demoTimer); if (!reduceMotion()) demoTimer = setInterval(() => {
    if (state.tab !== "estilo") { clearInterval(demoTimer); return; }
    demoK = (demoK + 1) % 5; const e = estiloMio(E); pcap.querySelectorAll(".w").forEach((el, i) => { const on = i === demoK; el.style.color = on ? e.resaltado : e.texto; el.style.transform = `scale(${on ? e.pop : 1})`; });
  }, 520);
  app.querySelectorAll("[data-color]").forEach((b) => b.addEventListener("click", () => { E[b.dataset.color] = b.dataset.v; guardado(); renderEstilo(); $("#saved")?.classList.add("show"); clearTimeout(estiloTimer); estiloTimer = setTimeout(() => $("#saved")?.classList.remove("show"), 1400); }));
  app.querySelectorAll("[data-colorin]").forEach((inp) => { inp.addEventListener("input", () => { E[inp.dataset.colorin] = inp.value; saveEstilo(); paint(); }); inp.addEventListener("change", () => { guardado(); renderEstilo(); }); });
  app.querySelectorAll("[data-font]").forEach((b) => b.addEventListener("click", () => { E.fuente = b.dataset.font; app.querySelectorAll("[data-font]").forEach((x) => x.setAttribute("aria-checked", String(x === b))); paint(); guardado(); }));
  $("#may").addEventListener("click", (ev) => { E.mayusculas = !E.mayusculas; ev.currentTarget.setAttribute("aria-checked", String(E.mayusculas)); paint(); guardado(); });
  app.querySelectorAll("[data-tono]").forEach((b) => b.addEventListener("click", () => { E.tono = b.dataset.tono; app.querySelectorAll("[data-tono]").forEach((x) => x.setAttribute("aria-pressed", String(x === b))); $("#tono-d").textContent = (TONOS.find((t) => t.id === E.tono) || TONOS[0]).desc; guardado(); }));
  app.querySelectorAll("[data-ej]").forEach((t) => t.addEventListener("input", () => { E.ejemplos[Number(t.dataset.ej)] = t.value.slice(0, 200); guardado(); }));
  app.querySelectorAll("[data-delej]").forEach((b) => b.addEventListener("click", () => { E.ejemplos.splice(Number(b.dataset.delej), 1); guardado(); renderEstilo(); }));
  $("#addej")?.addEventListener("click", () => { E.ejemplos.push(""); saveEstilo(); renderEstilo(); app.querySelector(`[data-ej="${E.ejemplos.length - 1}"]`)?.focus(); });
  $("#reset").addEventListener("click", () => { state.estilo = { ...ESTILO_DEF, ejemplos: [] }; guardado(); renderEstilo(); });
}

        ${p.id === "pro" ? `<button class="btn btn-primary btn-block" disabled style="margin-top:1.25rem">Muy pronto</button><p class="t-cap" style="text-align:center;margin-top:.5rem">Los pagos todavía no están disponibles.</p>` : ""}
